  <!-- flecha de altura -->
  <g stroke="#f5a623" stroke-width="3" fill="#f5a623" opacity=".9">
    <path d="M600 90 V520" fill="none" stroke-dasharray="8 8"/><path d="M592 104 L600 86 L608 104 Z"/><path d="M592 506 L600 524 L608 506 Z"/>
